[package]
name = "arm_sim"
version = "0.1.0"
edition = "2021"
description = "EMG-controlled 4-axis robot arm simulator (OpenBCI Cyton -> WASM/WebGL2)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
glam = "0.29"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
]

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
