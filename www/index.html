<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMG Arm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="view">
      <canvas id="gl"></canvas>
      <div id="hud">Drag to orbit · scroll to zoom</div>
      <div id="intent" hidden>
        <div class="what"></div>
        <div class="where"></div>
        <div class="conf"><div></div></div>
      </div>
      <div id="error" hidden></div>

      <!-- joint control: hold + or − to move; the angle above, and the real arm's while engaged -->
      <div id="manual">
        <div id="jgrid"></div>
        <label class="muscle-only" id="gain-field" title="EMG gain: how far a contraction drives its joint">
          <span>Gain</span>
          <input type="range" id="gain" min="0.2" max="3" step="0.05" value="1">
          <span id="gain-val" class="mono"></span>
        </label>
      </div>
      <button id="estop" hidden title="Stop the arm where it is and stop sending it commands (Space)">E STOP</button>

      <!-- phase 2: a small meter over the arm instead of the full-screen coach -->
      <!-- training: the gesture being trained, animated, at the top of the view (gestures only) -->
      <img id="trainer-anim" alt="" hidden>
      <div id="trainer" hidden>
        <div class="t-top"><span id="trainer-what"></span><span id="trainer-trial" class="mono"></span></div>
        <div class="t-meter"><div class="t-fill"></div><div class="t-center"></div></div>
        <div class="t-hold"><div></div></div>
        <div class="t-bottom">
          <span id="trainer-hint"></span>
          <span><button id="trainer-skip" class="small">Skip</button> <button id="trainer-stop" class="small">Stop · Esc</button></span>
        </div>
      </div>

      <div id="coach" hidden>
        <div class="card">
          <div class="top">
            <span id="coach-step"></span>
            <button id="coach-cancel" class="small">Cancel · Esc</button>
          </div>
          <div id="coach-phase"></div>
          <div id="coach-title"></div>
          <div id="coach-detail"></div>
          <!-- rest steps: how to hold the arm, in profile; gestures: the movement, animated -->
          <img id="coach-pose" alt="" hidden>
          <!-- each step holds here until the user is in position -->
          <div id="coach-ready" hidden>
            <div class="prompt">Press <kbd>Space</kbd> when you're ready</div>
            <button id="coach-ready-btn" class="primary">Ready</button>
          </div>
          <!-- only the 3-2-1 before recording; recording shows the bar instead -->
          <div id="coach-count" class="mono"></div>
          <div id="coach-check"><span class="dot"></span><span class="text"></span></div>
          <div id="fbar" hidden>
            <span id="fbar-label"></span>
            <div class="ftrack big"></div>
            <div id="fbar-legend"></div>
          </div>
          <button id="coach-skip" class="small" hidden>Skip this step</button>
          <div id="coach-results" hidden></div>
          <button id="coach-close" class="primary" hidden>Done</button>
          <div class="phase-bar"><div id="coach-bar"></div></div>
          <div id="coach-timeline"></div>
        </div>
      </div>
    </div>

    <aside id="panel">
      <header>
        <h1>EMG Arm</h1>
        <span id="mode-pill" class="pill">Manual</span>
      </header>

      <section>
        <div class="row">
          <button id="connect" class="primary wide">CONNECT EMG</button>
          <button id="simulate" title="Fake a Cyton stream to try EMG control without hardware">Simulate</button>
        </div>
        <div class="row">
          <button id="arm-connect" title="Connect the RoArm-M2-S by USB">CONNECT ARM</button>
          <button id="arm-engage" disabled title="Drive the real arm from the simulation, starting from where it is">ENGAGE</button>
        </div>
        <div id="arm-status" class="hint"></div>
        <div id="emg-state">Manual Mode Engaged</div>
        <p class="hint" id="source-hint"></p>
        <div id="bci-status" class="hint"></div>
        <!-- last 10 s of the stream: received and dropped, both in packets/s on one scale -->
        <details class="spark" id="stream">
          <summary class="spark-head" title="Show the last 10 s">
            <span><i class="key pps"></i>Packets/s <span id="pps" class="mono">0</span></span>
            <span><i class="key drops"></i>Dropped/s <span id="drops" class="mono">0</span></span>
          </summary>
          <canvas id="stream-chart" aria-label="Packets received and dropped per second over the last 10 seconds"></canvas>
          <div class="spark-foot"><span id="stream-when">last 10 s</span><span id="drops-total" class="mono"></span></div>
        </details>
      </section>

      <section>
        <h2>Control scheme</h2>
        <select id="scheme" class="full">
          <option value="muscle" selected>Muscle pairs</option>
          <option value="finger">Finger grid</option>
        </select>
        <!-- only when saving or loading the calibration fails -->
        <p class="hint" id="saved-status"></p>
      </section>

      <section class="muscle-only">
        <h2>Calibration</h2>
        <div class="row">
          <button id="gcal" class="primary" title="Rest in three positions, each gesture strong → half → faint, then training (about 6 minutes)">Calibrate + train</button>
          <button id="gtrain" title="Practise every gesture again: the level steps down as you get consistent">Train only</button>
          <button class="guide-open">Electrode guide</button>
        </div>
        <div class="cal-pill"><span id="cal-pill" class="pill warn">Uncalibrated</span></div>
        <div id="cal-status" class="hint"></div>
      </section>

      <section class="finger-only">
        <h2>Finger control</h2>
        <div class="row">
          <button id="fcal" class="primary">Calibrate + train</button>
          <button id="ftrain">Train only</button>
          <button class="guide-open">Electrode guide</button>
        </div>
        <div class="cal-pill"><span id="fcal-pill" class="pill warn">Uncalibrated</span></div>
        <div id="fcal-status" class="hint"></div>
        <div id="fposture" class="kv mono"></div>
        <label class="check"><input type="checkbox" id="fsimple" checked autocomplete="off"> Simple bands <small>rest under ¼ · − from ¼ to ½ · + over ½, no ceiling</small></label>
        <div id="fingers"></div>
        <label class="field">Speed <input type="range" id="fspeed" min="0.1" max="1" step="0.05" value="0.5"><span id="fspeed-val" class="mono"></span></label>
      </section>

      <section>
        <h2>EMG channels</h2>
        <div id="channels"></div>
      </section>

      <section>
        <div class="row">
          <button id="drift" class="active" aria-pressed="true" title="Under EMG, once no joint has moved for 1.5 s the arm eases back home (never while the real arm is engaged)">Drift ON</button>
          <button id="reset" title="Arm to its home pose, box back on the table">Reset</button>
          <button id="clear-trail">Clear trail</button>
        </div>
      </section>
    </aside>
  </main>

  <div id="guide" hidden>
    <figure>
      <img id="guide-img" src="electrodes.svg" alt="Electrode placement on the arm and wiring to the Cyton pin header">
      <figcaption id="guide-caption">Click anywhere or press Esc to close</figcaption>
      <!-- shown when the guide opens as the first page of a calibration -->
      <div id="guide-gate" hidden>
        <button id="guide-cancel">Cancel</button>
        <button id="guide-ready" class="primary">Electrodes are set up</button>
      </div>
    </figure>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
